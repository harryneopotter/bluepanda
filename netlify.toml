[build]
  # Directory to change to before starting a build
  base = "/"
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"
  
  # Default build command
  command = "npm run build"

[[redirects]]
  # Redirect all routes to index.html for client-side routing
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Node version
  NODE_VERSION = "18"

# RFC 8288 Link Headers for Agent Discovery
[[headers]]
  for = "/"
  [headers.values]
    Link = "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </docs/api>; rel=\"service-doc\""

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"
    Link = "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </docs/api>; rel=\"service-doc\""

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Link = "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </docs/api>; rel=\"service-doc\""

[[headers]]
  for = "/docs/api"
  [headers.values]
    Link = "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </docs/api>; rel=\"service-doc\""

[[headers]]
  for = "/agent-readme.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Added for Markdown Negotiation
[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"
